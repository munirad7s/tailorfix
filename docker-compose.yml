services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tailorfix
      POSTGRES_USER: tailorfix
      POSTGRES_PASSWORD: tailorfix
    volumes:
      - tailorfix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailorfix -d tailorfix"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tailorfix
      DATABASE_USER: tailorfix
      DATABASE_PASSWORD: tailorfix
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  tailorfix-db:
